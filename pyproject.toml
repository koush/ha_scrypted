[tool.ruff]
lint.select = ["D", "E", "F", "G", "I", "PLC", "PLE", "PLR", "PLW", "UP", "W"]
lint.ignore = [
    "D202",
    "D212",
    "D203",
    "D213",
    "E501",
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments (pytest fixtures)
    "PLR2004", # Magic value used in comparison
    "PLW2901", # Outer variable overwritten by inner target
    "UP006",   # keep type annotation style as is
    "UP007",   # keep type annotation style as is
    "PLE1205",
]
exclude = [
    ".venv",
    ".git",
    ".tox",
    "docs",
    "venv",
    "bin",
    "lib",
    "deps",
    "build",
]
line-length = 88

[tool.ruff.lint.isort]
force-sort-within-sections = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "homeassistant",
    "first-party",
    "local-folder",
]
known-first-party = ["custom_components.scrypted", "tests"]
combine-as-imports = true

[tool.ruff.lint.isort.sections]
"homeassistant" = ["homeassistant"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D102", "D107"]  # Don't require docstrings for test helper methods

[tool.mypy]
ignore_missing_imports = true
implicit_reexport = true
show_error_codes = true
local_partial_types = true
strict_equality = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]
disable_error_code = ["annotation-unchecked", "call-arg"]

[tool.pytest.ini_options]
addopts = "--cov=custom_components --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".git", "testing_config"]

[tool.coverage.report]
show_missing = true
fail_under = 100
